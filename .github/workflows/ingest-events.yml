name: Ingest eventos gratuitos Lima

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Fuente específica para comprobar (vacío = todas)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: pipeline
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pipeline/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium (fallback anti-bot)
        continue-on-error: true
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Test source adapters and quality gates
        run: npm test

      - name: Ingest
        run: |
          if [ -n "$SOURCE_FILTER" ]; then
            npm run ingest -- --source "$SOURCE_FILTER"
          else
            npm run ingest
          fi
        env:
          SOURCE_FILTER: ${{ inputs.source }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUBLISH_MODE: ${{ vars.PUBLISH_MODE }}
