name: Malls en Mac local

on:
  schedule:
    - cron: '0 3 * * *' # 22:00 America/Lima (UTC-5).
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar eventos válidos en Supabase (false = solo comprobar)'
        required: true
        type: boolean
        default: false
      repair_duplicates:
        description: 'Archivar duplicados de actividades continuas (requiere publish=true)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: local-malls
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner))
    runs-on: [plan-lima-malls]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pipeline
        shell: bash
    env:
      PLAYWRIGHT_CHANNEL: chrome
    steps:
      - name: Verify local platform
        working-directory: ${{ runner.temp }}
        run: |
          test "$RUNNER_OS" = macOS
          test -x '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Check adapters
        run: npm run typecheck && npm test
      - name: Collect both malls without database writes
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        run: |
          failed=0
          for source in mall-del-sur plaza-norte; do
            if npm run ingest:dry -- --source "$source" 2>&1 | tee "$RUNNER_TEMP/$source.log"; then
              :
            else
              failed=1
            fi
          done
          exit "$failed"
      - name: Archive confirmed ongoing-event duplicates
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && inputs.repair_duplicates }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          npx tsx src/repair-duplicates.ts
          npx tsx src/repair-duplicates.ts --apply
          npx tsx src/repair-duplicates.ts
      - name: Publish valid events from both malls
        if: ${{ github.event_name == 'schedule' || inputs.publish }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          failed=0
          for source in mall-del-sur plaza-norte; do
            if npm run ingest -- --source "$source" 2>&1 | tee "$RUNNER_TEMP/$source.log"; then
              :
            else
              failed=1
            fi
          done
          exit "$failed"
      - name: Preserve diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-malls-diagnostic
          path: |
            ${{ runner.temp }}/mall-del-sur.log
            ${{ runner.temp }}/plaza-norte.log
          if-no-files-found: warn
          retention-days: 7
