name: Debug Eventbrite WAF

on: workflow_dispatch

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm i --no-save playwright@1.49.1 && npx playwright install chromium --with-deps
      - name: Probe Eventbrite
        run: |
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          await page.goto('https://www.eventbrite.com/d/peru--lima/free--events/', { waitUntil: 'domcontentloaded', timeout: 45000 });
          await page.waitForTimeout(8000);
          const title = await page.title();
          const html = await page.content();
          console.log('title:', title);
          console.log('ld+json blocks:', (html.match(/application\/ld\+json/g) || []).length);
          console.log('event links:', (html.match(/eventbrite\.com(\.pe)?\/e\//g) || []).length);
          console.log('data-event-id:', (html.match(/data-event-id/g) || []).length);
          console.log('challenge markers:', (html.match(/Human Verification|gokuProps|awsWaf/g) || []).length);
          await browser.close();
          EOF
