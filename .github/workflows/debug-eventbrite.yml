name: Debug Eventbrite WAF

on: workflow_dispatch

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm i --no-save playwright@1.49.1 && npx playwright install chromium --with-deps
      - name: Probe Eventbrite
        run: |
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true, args: ['--disable-blink-features=AutomationControlled'] });
          const page = await browser.newPage();
          await page.goto('https://www.eventbrite.com/d/peru--lima/free--events/', { waitUntil: 'domcontentloaded', timeout: 45000 });
          for (const wait of [5000, 10000, 15000]) {
            await page.waitForTimeout(wait);
            const title = await page.title();
            const html = await page.content();
            console.log(`after +${wait}ms -> title: ${title} | ld+json: ${(html.match(/application\/ld\+json/g) || []).length} | events: ${(html.match(/eventbrite\.com(\.pe)?\/e\//g) || []).length} | challenge: ${(html.match(/Human Verification|gokuProps|awsWaf/g) || []).length}`);
            if (!title.includes('Human Verification')) break;
          }
          await browser.close();
          EOF
      - name: Probe official sources
        run: |
          for url in "https://www.gob.pe/es/institucion/cultura/colecciones/44-agenda-cultural" "https://visita-lima.limaciudaddelosreyes.com.pe/es/eventos" "https://www.miraflores.gob.pe" "https://lum.cultura.pe/actividades"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 20 -A "Mozilla/5.0" "$url")
            echo "$code $url"
          done
